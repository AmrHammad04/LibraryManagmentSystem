<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Member Form</title>
    <link rel="stylesheet" th:href="@{/css/library.css}">
</head>
<body>
    <h1 th:text="${member.id == 0 ? 'Add Member' : 'Edit Member'}"></h1>

    <form th:action="${member.id == 0}
                    ? @{/members}
                    : @{/members/{id}(id=${member.id})}"
          th:object="${member}"
          method="post"
          novalidate>

        <p>
            Name:
            <input type="text" th:field="*{name}">
            <span th:if="${#fields.hasErrors('name')}"
                  th:errors="*{name}"></span>
        </p>

        <p>
            Phone:
            <input type="tel" th:field="*{phone}">
            <span th:if="${#fields.hasErrors('phone')}"
                  th:errors="*{phone}"></span>
        </p>

        <p>
            Email:
            <input type="email" th:field="*{email}">
            <span th:if="${#fields.hasErrors('email')}"
                  th:errors="*{email}"></span>
        </p>
        <p th:if="${member.id == 0}">
            A card number will be assigned when you save the member.
        </p>
        <p th:if="${member.id != 0}">
            Card number: <span th:text="${member.id + 1000}"></span>
        </p>

        <button type="submit">Save Member</button>
        <a th:href="@{/members}">Cancel</a>
    </form>
</body>
</html>
