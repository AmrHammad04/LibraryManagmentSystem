<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Edit Book</title>
</head>
<body>
    <h1>Edit Book</h1>

    <form th:action="@{/items/books/{id}(id=${book.id})}"
          th:object="${book}" method="post">
        <input type="hidden"
               th:name="${_csrf.parameterName}"
               th:value="${_csrf.token}">

        <p>Title: <input type="text" th:field="*{title}" required></p>
        <p>Author: <input type="text" th:field="*{author}" required></p>
        <p>Year: <input type="number" th:field="*{yearOfPublication}" required></p>
        <p>ISBN: <input type="text" th:field="*{isbn}" required></p>
        <p>Pages: <input type="number" th:field="*{numberOfPages}" min="1" required></p>

        <button type="submit">Save Changes</button>
        <a th:href="@{/items}">Cancel</a>
    </form>
</body>
</html>
