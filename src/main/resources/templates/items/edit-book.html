<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Edit Book</title>
</head>
<body>
    <h1>Edit Book</h1>

    <form th:action="@{/items/books/{id}(id=${book.id})}"
          th:object="${book}"
          method="post"
          novalidate>
        <input type="hidden"
               th:name="${_csrf.parameterName}"
               th:value="${_csrf.token}">

        <p>
            Title: <input type="text" th:field="*{title}" required>
            <span th:if="${#fields.hasErrors('title')}" th:errors="*{title}"></span>
        </p>

        <p>
            Author: <input type="text" th:field="*{author}" required>
            <span th:if="${#fields.hasErrors('author')}" th:errors="*{author}"></span>
        </p>

        <p>
            Year: <input type="number" th:field="*{yearOfPublication}" required>
            <span th:if="${#fields.hasErrors('yearOfPublication')}"
                  th:errors="*{yearOfPublication}"></span>
        </p>

        <p>
            ISBN: <input type="text" th:field="*{isbn}" required>
            <span th:if="${#fields.hasErrors('isbn')}" th:errors="*{isbn}"></span>
        </p>

        <p>
            Pages: <input type="number" th:field="*{numberOfPages}" min="1" required>
            <span th:if="${#fields.hasErrors('numberOfPages')}"
                  th:errors="*{numberOfPages}"></span>
        </p>

        <button type="submit">Save Changes</button>
        <a th:href="@{/items}">Cancel</a>
    </form>
</body>
</html>
