<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Add Newspaper</title>
    <link rel="stylesheet" th:href="@{/css/library.css}">
</head>
<body>
    <h1>Add Newspaper</h1>

    <form th:action="@{/items/newspapers}"
          th:object="${newspaper}"
          method="post"
          novalidate>

        <input type="hidden"
               th:name="${_csrf.parameterName}"
               th:value="${_csrf.token}">

        <p>
            Title: <input type="text" th:field="*{title}">
            <span th:if="${#fields.hasErrors('title')}"
                  th:errors="*{title}"></span>
        </p>

        <p>
            Publisher: <input type="text" th:field="*{author}">
            <span th:if="${#fields.hasErrors('author')}"
                  th:errors="*{author}"></span>
        </p>

        <p>
            Year: <input type="number" th:field="*{yearOfPublication}">
            <span th:if="${#fields.hasErrors('yearOfPublication')}"
                  th:errors="*{yearOfPublication}"></span>
        </p>

        <p>
            Publication date:
            <input type="date" th:field="*{publicationDate}">
            <span th:if="${#fields.hasErrors('publicationDate')}"
                  th:errors="*{publicationDate}"></span>
        </p>

        <p>
            Region: <input type="text" th:field="*{region}">
            <span th:if="${#fields.hasErrors('region')}"
                  th:errors="*{region}"></span>
        </p>

        <fieldset>
            <legend>Existing tags</legend>
            <p th:if="${#lists.isEmpty(availableTags)}">No tags yet.</p>

            <label th:each="tag : ${availableTags}">
                <input type="checkbox"
                       name="tagIds"
                       th:value="${tag.id}"
                       th:checked="${selectedTagIds.contains(tag.id)}">
                <span th:text="${tag.name}"></span>
            </label>
        </fieldset>

        <p>
            New tags (separate with commas):
            <input type="text"
                   name="newTagNames"
                   th:value="${newTagNames}"
                   placeholder="Local, Daily">
        </p>

        <p th:each="error : ${#fields.globalErrors()}"
           th:text="${error.defaultMessage}"></p>

        <button type="submit">Save Newspaper</button>
        <a th:href="@{/items}">Cancel</a>
    </form>
</body>
</html>
