<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Library Items</title>
    <link rel="stylesheet" th:href="@{/css/library.css}">
</head>
<body>
    <h1>Library Items</h1>

    <p>
        Signed in as <strong th:text="${username}">username</strong>
        (<span th:text="${roles}"></span>)
    </p>

    <nav>
        <a th:if="${admin or librarian}" th:href="@{/items/books/new}">Add Book</a>
        <a th:if="${admin or librarian}" th:href="@{/items/magazines/new}">Add Magazine</a>
        <a th:if="${admin or librarian}" th:href="@{/items/newspapers/new}">Add Newspaper</a>
        <a th:if="${admin or librarian}" th:href="@{/members}">Members</a>
        <a th:if="${admin or librarian}" th:href="@{/borrowings}">Borrowings</a>
        <a th:if="${admin}" th:href="@{/reports}">Reports</a>
    </nav>

    <form class="search-form" th:action="@{/items}" method="get">
        <input type="text" name="title" placeholder="Title" th:value="${title}">
        <input type="text" name="author" placeholder="Author / Publisher" th:value="${author}">
        <input type="number" name="year" placeholder="Year" th:value="${year}">

        <label>
            <input type="checkbox" name="availableOnly" value="true"
                   th:checked="${availableOnly}">
            Available only
        </label>

        <select name="type">
            <option value="" th:selected="${type == null or type == ''}">
                All types
            </option>
            <option th:each="itemType : ${itemTypes}"
                    th:value="${itemType}"
                    th:text="${itemType}"
                    th:selected="${type == itemType}">
            </option>
        </select>

        <fieldset>
            <legend>Sort by</legend>
            <label th:each="option : ${sortOptions}">
                <input type="radio"
                       name="sortBy"
                       th:value="${option}"
                       th:checked="${sortBy == option}">
                <span th:text="${option == 'id' ? 'ID' : #strings.capitalize(option)}"></span>
            </label>
        </fieldset>

        <fieldset>
            <legend>Item types</legend>
            <label th:each="itemType : ${itemTypes}">
                <input type="checkbox"
                       name="types"
                       th:value="${itemType}"
                       th:checked="${selectedTypes.contains(itemType)}">
                <span th:text="${itemType}"></span>
            </label>
        </fieldset>

        <button type="submit">Search</button>
        <a th:href="@{/items}">Clear</a>
    </form>

    <p th:if="${error}" th:text="${error}"></p>
    <p th:if="${#lists.isEmpty(items)}">No items found.</p>

    <table border="1" th:unless="${#lists.isEmpty(items)}">
        <thead>
            <tr>
                <th>ID</th>
                <th>Title</th>
                <th>Type</th>
                <th>Author / Publisher</th>
                <th>Year</th>
                <th>Tags</th>
                <th>Availability</th>
                <th th:if="${librarian or admin}">Actions</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="item : ${items}">
                <td th:text="${item.id}"></td>
                <td th:text="${item.title}"></td>
                <td>
                    <span th:if="${bookIds.contains(item.id)}">Book</span>
                    <span th:if="${magazineIds.contains(item.id)}">Magazine</span>
                    <span th:if="${newspaperIds.contains(item.id)}">Newspaper</span>
                </td>
                <td th:text="${item.author}"></td>
                <td th:text="${item.yearOfPublication}"></td>
                <td>
                    <span th:if="${#lists.isEmpty(itemTags[item.id])}">No tags</span>
                    <span th:each="tag, status : ${itemTags[item.id]}"
                          th:text="${tag.name + (status.last ? '' : ', ')}"></span>
                </td>
                <td th:text="${item.availability ? 'Available' : 'Borrowed'}"></td>
                <td th:if="${librarian or admin}">
                    <div class="actions">
                        <form th:if="${bookIds.contains(item.id)}"
                              th:action="@{/items/books/{id}/edit(id=${item.id})}"
                              method="get">
                            <button type="submit">Edit</button>
                        </form>

                        <form th:if="${magazineIds.contains(item.id)}"
                              th:action="@{/items/magazines/{id}/edit(id=${item.id})}"
                              method="get">
                            <button type="submit">Edit</button>
                        </form>

                        <form th:if="${newspaperIds.contains(item.id)}"
                              th:action="@{/items/newspapers/{id}/edit(id=${item.id})}"
                              method="get">
                            <button type="submit">Edit</button>
                        </form>

                        <form th:if="${admin}"
                              th:action="@{/items/{id}/delete(id=${item.id})}"
                              method="post">
                            <input type="hidden"
                                   th:name="${_csrf.parameterName}"
                                   th:value="${_csrf.token}">
                            <button type="submit">Delete</button>
                        </form>
                    </div>
                </td>
            </tr>
        </tbody>
    </table>

    <form th:action="@{/logout}" method="post">
        <input type="hidden"
               th:name="${_csrf.parameterName}"
               th:value="${_csrf.token}">
        <button type="submit">Log out</button>
    </form>
</body>
</html>
