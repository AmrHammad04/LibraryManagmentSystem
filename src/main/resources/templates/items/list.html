<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Library Items</title>
</head>
<body>
    <h1>Library Items</h1>

    <form th:action="@{/logout}" method="post">
        <input type="hidden"
               th:name="${_csrf.parameterName}"
               th:value="${_csrf.token}">
        <button type="submit">Log out</button>
    </form>

    <form th:action="@{/items}" method="get">
        <input type="text" name="title" placeholder="Title" th:value="${title}">
        <input type="text" name="author" placeholder="Author / Publisher" th:value="${author}">
        <input type="number" name="year" placeholder="Year" th:value="${year}">

        <button type="submit">Search</button>
        <a th:href="@{/items}">Clear</a>
    </form>

    <p th:if="${error}" th:text="${error}"></p>
    <p th:if="${#lists.isEmpty(items)}">No items found.</p>

    <table border="1" th:unless="${#lists.isEmpty(items)}">
        <thead>
            <tr>
                <th>ID</th>
                <th>Title</th>
                <th>Author / Publisher</th>
                <th>Year</th>
                <th>Availability</th>
                <th th:if="${admin}">Actions</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="item : ${items}">
                <td th:text="${item.id}"></td>
                <td th:text="${item.title}"></td>
                <td th:text="${item.author}"></td>
                <td th:text="${item.yearOfPublication}"></td>
                <td th:text="${item.availability ? 'Available' : 'Borrowed'}"></td>
                <td th:if="${admin}">
                    <form th:action="@{/items/{id}/delete(id=${item.id})}"
                          method="post">
                        <input type="hidden"
                               th:name="${_csrf.parameterName}"
                               th:value="${_csrf.token}">
                        <button type="submit">Delete</button>
                    </form>
                </td>
            </tr>
        </tbody>
    </table>
</body>
</html>
