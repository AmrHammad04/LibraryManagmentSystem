<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Add Magazine</title>
</head>
<body>
    <h1>Add Magazine</h1>

    <form th:action="@{/items/magazines}"
          th:object="${magazine}"
          method="post">

        <input type="hidden"
               th:name="${_csrf.parameterName}"
               th:value="${_csrf.token}">

        <p>Title: <input type="text" th:field="*{title}" required></p>
        <p>Publisher: <input type="text" th:field="*{author}" required></p>
        <p>Year: <input type="number" th:field="*{yearOfPublication}" required></p>
        <p>Issue number: <input type="number" th:field="*{issueNumber}" min="1" required></p>
        <p>Category: <input type="text" th:field="*{category}" required></p>

        <button type="submit">Save Magazine</button>
        <a th:href="@{/items}">Cancel</a>
    </form>
</body>
</html>
