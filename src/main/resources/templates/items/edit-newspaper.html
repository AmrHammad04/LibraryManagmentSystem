<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Edit Newspaper</title>
</head>
<body>
    <h1>Edit Newspaper</h1>

    <form th:action="@{/items/newspapers/{id}(id=${newspaper.id})}"
          method="post">

        <input type="hidden"
               th:name="${_csrf.parameterName}"
               th:value="${_csrf.token}">

        <p>
            <label>Title:
                <input type="text" name="title"
                       th:value="${newspaper.title}" required>
            </label>
        </p>

        <p>
            <label>Author / Publisher:
                <input type="text" name="author"
                       th:value="${newspaper.author}" required>
            </label>
        </p>

        <p>
            <label>Year:
                <input type="number" name="yearOfPublication"
                       th:value="${newspaper.yearOfPublication}" required>
            </label>
        </p>

        <p>
            <label>Publication Date:
                <input type="date" name="publicationDate"
                       th:value="${newspaper.publicationDate}" required>
            </label>
        </p>

        <p>
            <label>Region:
                <input type="text" name="region"
                       th:value="${newspaper.region}" required>
            </label>
        </p>

        <button type="submit">Save Changes</button>
        <a th:href="@{/items}">Cancel</a>
    </form>
</body>
</html>
